<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="Playing Cards.css">
</head>

<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left">
        <div>A</div><div>♠</div>
      </div>
      <div class="middle">♠</div>
      <div class="right">
        <div>♠</div><div>A</div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div>A</div><div>♣</div>
      </div>
      <div class="middle">♣</div>
      <div class="right">
        <div>♣</div><div>A</div>
      </div>
    </div>
    <div class="card">
      <div class="left" style="color: red">
        <div>A</div><div>♥</div>
      </div>
      <div class="middle" style="color: red">♥</div>
      <div class="right" style="color: red">
        <div>♥</div><div>A</div>
      </div>
    </div>
    <div class="card">
      <div class="left" style="color: red">
        <div>A</div><div>♦</div>
      </div>
      <div class="middle" style="color: red">♦</div>
      <div class="right" style="color: red">
        <div>♦</div><div>A</div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div>2</div><div>♠</div>
      </div>
      <div class="middle">♠</div>
      <div class="right">
        <div>♠</div><div>2</div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div>2</div><div>♣</div>
      </div>
      <div class="middle">♣</div>
      <div class="right">
        <div>♣</div><div>2</div>
      </div>
    </div>
    <div class="card">
      <div class="left" style="color: red">
        <div>2</div><div>♥</div>
      </div>
      <div class="middle" style="color: red">♥</div>
      <div class="right" style="color: red">
        <div>♥</div><div>2</div>
      </div>
    </div>
    <div class="card">
      <div class="left" style="color: red">
        <div>2</div><div>♦</div>
      </div>
      <div class="middle" style="color: red">♦</div>
      <div class="right" style="color: red">
        <div>♦</div><div>2</div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div>3</div><div>♠</div>
      </div>
      <div class="middle">♠</div>
      <div class="right">
        <div>♠</div><div>3</div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div>3</div><div>♣</div>
      </div>
      <div class="middle">♣</div>
      <div class="right">
        <div>♣</div><div>3</div>
      </div>
    </div>
    <div class="card">
      <div class="left" style="color: red">
        <div>3</div><div>♥</div>
      </div>
      <div class="middle" style="color: red">♥</div>
      <div class="right" style="color: red">
        <div>♥</div><div>3</div>
      </div>
    </div>
    <div class="card">
      <div class="left" style="color: red">
        <div>3</div><div>♦</div>
      </div>
      <div class="middle" style="color: red">♦</div>
      <div class="right" style="color: red">
        <div>♦</div><div>3</div>
      </div>
    </div>
  </main>
</body>

</html>
